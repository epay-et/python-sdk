[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "epay"
version = "0.2.0"
description = "Official ePay Business API client for Python."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["epay", "payments", "ethiopia", "telebirr", "cbe", "payment-gateway"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.23,<1"]

[project.urls]
Homepage = "https://github.com/epay-et/python-sdk"
Documentation = "https://github.com/epay-et/python-sdk#readme"
Repository = "https://github.com/epay-et/python-sdk"
Issues = "https://github.com/epay-et/python-sdk/issues"

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "pytest-asyncio>=0.21",
  "mypy>=1.8",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/epay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
filterwarnings = ["error"]

[tool.mypy]
python_version = "3.9"
strict = true
files = ["src/epay"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
  # This package supports Python 3.9, where PEP 604 unions and PEP 585 generics
  # are not valid at runtime. `from __future__ import annotations` makes them
  # safe in annotation position, but the response TypedDicts are part of the
  # public API: keeping Optional[...] and List[...] leaves their annotations
  # evaluable by anything that calls typing.get_type_hints on them, such as a
  # Pydantic model built from one. Revisit when the floor moves to 3.10.
  "UP006", # non-pep585-annotation  (List[x] -> list[x])
  "UP007", # non-pep604-annotation-union  (Union[a, b] -> a | b)
  "UP035", # deprecated-import  (typing.List -> list)
  "UP045", # non-pep604-annotation-optional  (Optional[x] -> x | None)
  # Combining context managers in one parenthesized `with` is only officially
  # supported from 3.10; CPython 3.9's PEG parser accepts it incidentally, which
  # is not something a published package should rely on.
  "SIM117", # multiple-with-statements
]
